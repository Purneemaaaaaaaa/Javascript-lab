<!DOCTYPE html>
<html>
<head>
    <title>Largest of Five Numbers</title>
</head>

<body>

<h2>Find Largest of Five Numbers</h2>

<script>
    var num1 = Number(prompt("Enter first number:"));
    var num2 = Number(prompt("Enter second number:"));
    var num3 = Number(prompt("Enter third number:"));
    var num4 = Number(prompt("Enter fourth number:"));
    var num5 = Number(prompt("Enter fifth number:"));

    var largest = Math.max(num1, num2, num3, num4, num5);

    document.write("<h3>Output</h3>");
    document.write("First Number: " + num1 + "<br>");
    document.write("Second Number: " + num2 + "<br>");
    document.write("Third Number: " + num3 + "<br>");
    document.write("Fourth Number: " + num4 + "<br>");
    document.write("Fifth Number: " + num5 + "<br><br>");

    document.write("<strong>The largest number is: " + largest + "</strong>");
</script>

</body>
</html>
