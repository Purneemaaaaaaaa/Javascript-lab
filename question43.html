<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>

    <style>
        body {
            font-family: Arial;
        }

        form {
            width: 500px;
            margin: auto;
            padding: 20px;
            border: 1px solid gray;
        }

        label {
            display: inline-block;
            width: 120px;
            margin-bottom: 15px;
        }

        input, select {
            padding: 7px;
            width: 280px;
        }

        input[type="radio"] {
            width: auto;
        }

        button {
            padding: 10px 25px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        #error {
            color: red;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<h2 style="text-align:center;">
    Registration Form
</h2>

<form onsubmit="return validateForm()">

    <div id="error"></div>

    <label>Name:</label>
    <input type="text" id="name">
    <br>

    <label>Address:</label>
    <input type="text" id="address">
    <br>

    <label>Username:</label>
    <input type="text" id="username">
    <br>

    <label>Email:</label>
    <input type="text" id="email">
    <br>

    <label>Password:</label>
    <input type="password" id="password">
    <br>

    <label>Website:</label>
    <input type="text" id="website">
    <br>

    <label>Phone:</label>
    <input type="text" id="phone">
    <br>

    <label>Gender:</label>

    <input type="radio" name="gender" value="Male"> Male

    <input type="radio" name="gender" value="Female"> Female

    <br><br>

    <label>Course:</label>

    <select id="course">
        <option value="">Select Course</option>
        <option value="BCA">BCA</option>
        <option value="BIM">BIM</option>
        <option value="BBS">BBS</option>
        <option value="BIT">BIT</option>
    </select>

    <br><br>

    <button type="submit">Submit</button>

</form>

<script>

function validateForm() {

    let name = document.getElementById("name").value.trim();
    let address = document.getElementById("address").value.trim();
    let username = document.getElementById("username").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;
    let website = document.getElementById("website").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let course = document.getElementById("course").value;

    let error = document.getElementById("error");

    error.innerHTML = "";

    // Name validation
    if (name === "") {
        error.innerHTML = "Name cannot be empty.";
        return false;
    }

    if (/\d/.test(name)) {
        error.innerHTML = "Name must not contain numbers.";
        return false;
    }

    // Address validation
    if (address === "") {
        error.innerHTML = "Address cannot be empty.";
        return false;
    }

    // Username validation
    if (username === "") {
        error.innerHTML = "Username cannot be empty.";
        return false;
    }

    if (!/^[A-Za-z0-9_]+$/.test(username)) {
        error.innerHTML =
            "Username can contain only letters, numbers and underscore.";
        return false;
    }

    // Email validation
    if (email === "") {
        error.innerHTML = "Email cannot be empty.";
        return false;
    }

    if (!email.includes("@")) {
        error.innerHTML = "Email must contain @ symbol.";
        return false;
    }

    // Password validation
    if (password === "") {
        error.innerHTML = "Password cannot be empty.";
        return false;
    }

    if (password.length < 8) {
        error.innerHTML =
            "Password must be at least 8 characters long.";
        return false;
    }

    if (!/[0-9]/.test(password)) {
        error.innerHTML =
            "Password must contain at least one digit.";
        return false;
    }

    if (!/[A-Z]/.test(password)) {
        error.innerHTML =
            "Password must contain at least one uppercase character.";
        return false;
    }

    if (!/[a-z]/.test(password)) {
        error.innerHTML =
            "Password must contain at least one lowercase character.";
        return false;
    }

    if (!/[^A-Za-z0-9]/.test(password)) {
        error.innerHTML =
            "Password must contain at least one special character.";
        return false;
    }

    // Phone validation
    if (phone === "") {
        error.innerHTML = "Phone cannot be empty.";
        return false;
    }

    if (!/^[0-9]+$/.test(phone)) {
        error.innerHTML =
            "Phone must contain numbers only.";
        return false;
    }

    if (!/^[98796]/.test(phone)) {
        error.innerHTML =
            "Phone must start with 9, 8, 7 or 6.";
        return false;
    }

    // Gender validation
    let gender = document.querySelector(
        'input[name="gender"]:checked'
    );

    if (!gender) {
        error.innerHTML = "Please select gender.";
        return false;
    }

    // Course validation
    if (course === "") {
        error.innerHTML = "Please select a course.";
        return false;
    }

    alert("Form submitted successfully!");

    return true;
}

</script>

</body>
</html>
