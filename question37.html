<!DOCTYPE html>
<html>
<head>
    <title>Counter App</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        .counter {
            margin-top: 50px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: green;
            color: white;
            cursor: pointer;
        }

        #count {
            padding: 10px 30px;
            background-color: pink;
            display: inline-block;
        }
    </style>
</head>

<body>

<div class="counter">

    <h2>Counter App</h2>

    <button onclick="increase()">+</button>

    <span id="count">0</span>

    <button onclick="decrease()">-</button>

    <br>

    <button onclick="reset()">Reset</button>

</div>

<script>
let count = 0;

function increase() {
    count++;
    document.getElementById("count").innerHTML = count;
}

function decrease() {
    count--;
    document.getElementById("count").innerHTML = count;
}

function reset() {
    count = 0;
    document.getElementById("count").innerHTML = count;
}
</script>

</body>
</html>
