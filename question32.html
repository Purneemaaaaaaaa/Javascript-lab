<!DOCTYPE html>
<html>
<head>
    <title>Image Slider</title>

    <style>
        body {
            text-align: center;
        }

        img {
            width: 500px;
            height: 300px;
            object-fit: cover;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>Image Slider</h2>

<img id="slider" src="https://picsum.photos/id/1015/500/300">

<br>

<button onclick="previous()">Previous</button>
<button onclick="next()">Next</button>

<script>
let images = [
    "https://picsum.photos/id/1015/500/300",
    "https://picsum.photos/id/1016/500/300",
    "https://picsum.photos/id/1018/500/300",
    "https://picsum.photos/id/1020/500/300",
    "https://picsum.photos/id/1024/500/300"
];

let index = 0;

function showImage() {
    document.getElementById("slider").src = images[index];
}

function next() {
    index++;

    if (index >= images.length) {
        index = 0;
    }

    showImage();
}

function previous() {
    index--;

    if (index < 0) {
        index = images.length - 1;
    }

    showImage();
}
</script>

</body>
</html>
